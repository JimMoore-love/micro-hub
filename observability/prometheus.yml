# ============================================================
# Prometheus Configuration - FullStack Microservice
# ============================================================
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # ----------------------------------------------------------
  # API Gateway
  # ----------------------------------------------------------
  - job_name: "gateway"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "gateway:9090"
        labels:
          service: gateway
          env: "production"
          team: platform

  # ----------------------------------------------------------
  # User Service
  # ----------------------------------------------------------
  - job_name: "user-service"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "user-service:9091"
        labels:
          service: user-service
          env: "production"
          team: platform

  # ----------------------------------------------------------
  # Order Service
  # ----------------------------------------------------------
  - job_name: "order-service"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "order-service:9092"
        labels:
          service: order-service
          env: "production"
          team: platform

  # ----------------------------------------------------------
  # AI Service
  # ----------------------------------------------------------
  - job_name: "ai-service"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "ai-service:9093"
        labels:
          service: ai-service
          env: "production"
          team: ai

  # ----------------------------------------------------------
  # Jaeger (self-monitoring)
  # ----------------------------------------------------------
  - job_name: "jaeger"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "jaeger:14269"
        labels:
          service: jaeger
          env: "production"

  # ----------------------------------------------------------
  # Consul (service discovery metrics)
  # ----------------------------------------------------------
  - job_name: "consul"
    metrics_path: /v1/agent/metrics
    params:
      format: ["prometheus"]
    static_configs:
      - targets:
          - "consul:8500"
        labels:
          service: consul
          env: "production"

  # ----------------------------------------------------------
  # NATS (message queue metrics)
  # ----------------------------------------------------------
  - job_name: "nats"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "nats:8222"
        labels:
          service: nats
          env: "production"

  # ----------------------------------------------------------
  # MinIO (object storage metrics)
  # ----------------------------------------------------------
  - job_name: "minio"
    metrics_path: /minio/v2/metrics/cluster
    bearer_token: ""
    static_configs:
      - targets:
          - "minio:9000"
        labels:
          service: minio
          env: "production"
